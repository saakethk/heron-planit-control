name: CrewSafe
options:
  bundleIdPrefix: com.swamphacks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

schemes:
  CrewSafe:
    build:
      targets:
        CrewSafe: all
    run:
      config: Debug
      # Tick or untick in Xcode: Product > Scheme > Edit Scheme > Run > Arguments.
      commandLineArguments:
        "-useLiveBackend YES": true
        "-skipNotificationPrompt YES": false
        "-chooseLocation NO": false
    archive:
      config: Release

targets:
  CrewSafe:
    type: application
    platform: iOS
    sources:
      - path: CrewSafe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swamphacks.crewsafe.saake
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Apple team used for device builds (Xcode > Settings > Accounts). Teammates
        # building on their own phones should swap in their team ID.
        DEVELOPMENT_TEAM: 9798G74GXR
        CODE_SIGN_STYLE: Automatic
      configs:
        # Phone Debug builds reach the backend on this Mac. Set to your Mac's
        # `scutil --get LocalHostName` plus ".local", or its IP address.
        Debug:
          CREWSAFE_DEV_SERVER_HOST: 10.136.45.252
        Release:
          CREWSAFE_DEV_SERVER_HOST: ""
    info:
      path: CrewSafe/Info.plist
      properties:
        CFBundleDisplayName: Heron
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Heron uses the camera so you can attach photos to hazard reports.
        NSPhotoLibraryUsageDescription: Heron lets you attach existing photos to hazard reports.
        NSLocationWhenInUseUsageDescription: Heron uses your location to tag hazard reports and find the nearest job site.
        NSLocalNetworkUsageDescription: Heron connects to a development server on your network for live hazard data.
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.swamphacks.crewsafe.saake.refresh
        CrewSafeDevServerHost: $(CREWSAFE_DEV_SERVER_HOST)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
