<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%" style="background:#0b131e; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162232" />
      <stop offset="100%" stop-color="#0f1926" />
    </linearGradient>
    <linearGradient id="accentTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title / Label -->
  <text x="40" y="36" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">HERON HIGH-LEVEL ARCHITECTURE PIPELINE</text>
  <text x="920" y="36" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="end">END-TO-END LATENCY &lt; 2 MS</text>

  <!-- Connecting Lines -->
  <path d="M 195 135 L 225 135" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="4,4" opacity="0.8" />
  <path d="M 380 135 L 410 135" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="4,4" opacity="0.8" />
  <path d="M 565 135 L 595 135" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="4,4" opacity="0.8" />
  <path d="M 750 135 L 780 135" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="4,4" opacity="0.8" />

  <!-- CARD 1: Data Sources -->
  <g transform="translate(40, 55)" filter="url(#cardShadow)">
    <rect width="155" height="160" rx="10" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect width="155" height="4" rx="2" fill="#38bdf8" />
    <circle cx="26" cy="32" r="14" fill="#0c4a6e" />
    <text x="26" y="36" font-size="13" text-anchor="middle">📡</text>
    <text x="48" y="28" fill="#f8fafc" font-size="13" font-weight="700">Live Telemetry</text>
    <text x="48" y="42" fill="#64748b" font-size="10" font-weight="500">Multimodal Feeds</text>
    <line x1="16" y1="58" x2="139" y2="58" stroke="#1e293b" stroke-width="1" />
    
    <text x="16" y="80" fill="#cbd5e1" font-size="11" font-weight="600">• NOAA GOES-19 GLM</text>
    <text x="16" y="98" fill="#cbd5e1" font-size="11" font-weight="600">• NWS Alerts (CAP 1.2)</text>
    <text x="16" y="116" fill="#cbd5e1" font-size="11" font-weight="600">• Open-Meteo Weather</text>
    <text x="16" y="134" fill="#cbd5e1" font-size="11" font-weight="600">• ECMWF Soil Model</text>
    <text x="16" y="152" fill="#cbd5e1" font-size="11" font-weight="600">• FEMA 100-Yr Flood</text>
  </g>

  <!-- CARD 2: Feature Normalization -->
  <g transform="translate(225, 55)" filter="url(#cardShadow)">
    <rect width="155" height="160" rx="10" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect width="155" height="4" rx="2" fill="#2dd4bf" />
    <circle cx="26" cy="32" r="14" fill="#042f2e" />
    <text x="26" y="36" font-size="13" text-anchor="middle">⚙️</text>
    <text x="48" y="28" fill="#f8fafc" font-size="13" font-weight="700">Feature Pipeline</text>
    <text x="48" y="42" fill="#64748b" font-size="10" font-weight="500">Processing Tier</text>
    <line x1="16" y1="58" x2="139" y2="58" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="80" fill="#cbd5e1" font-size="11" font-weight="600">• 28 Feature Vector</text>
    <text x="16" y="98" fill="#cbd5e1" font-size="11" font-weight="600">• Async Rate Pollers</text>
    <text x="16" y="116" fill="#cbd5e1" font-size="11" font-weight="600">• Spatial Geofencing</text>
    <text x="16" y="134" fill="#cbd5e1" font-size="11" font-weight="600">• Soil Saturation Math</text>
    <text x="16" y="152" fill="#cbd5e1" font-size="11" font-weight="600">• Time-Series Cache</text>
  </g>

  <!-- CARD 3: ML Model & Safety Engine -->
  <g transform="translate(410, 55)" filter="url(#cardShadow)">
    <rect width="155" height="160" rx="10" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="2" />
    <rect width="155" height="4" rx="2" fill="url(#accentAmber)" />
    <circle cx="26" cy="32" r="14" fill="#451a03" />
    <text x="26" y="36" font-size="13" text-anchor="middle">🧠</text>
    <text x="48" y="28" fill="#f8fafc" font-size="13" font-weight="700">AI Safety Engine</text>
    <text x="48" y="42" fill="#f59e0b" font-size="10" font-weight="600">Core Intelligence</text>
    <line x1="16" y1="58" x2="139" y2="58" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="80" fill="#fef3c7" font-size="11" font-weight="700">• Multi-Hazard GBDT</text>
    <text x="16" y="98" fill="#cbd5e1" font-size="11" font-weight="600">• Calibrated 0–10 Index</text>
    <text x="16" y="116" fill="#fef3c7" font-size="11" font-weight="700">• 10-Mi Lightning Hold</text>
    <text x="16" y="134" fill="#cbd5e1" font-size="11" font-weight="600">• Heat &amp; Flood Rules</text>
    <text x="16" y="152" fill="#cbd5e1" font-size="11" font-weight="600">• Continuous Retrain</text>
  </g>

  <!-- CARD 4: Realtime Gateway -->
  <g transform="translate(595, 55)" filter="url(#cardShadow)">
    <rect width="155" height="160" rx="10" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect width="155" height="4" rx="2" fill="#38bdf8" />
    <circle cx="26" cy="32" r="14" fill="#0c4a6e" />
    <text x="26" y="36" font-size="13" text-anchor="middle">⚡</text>
    <text x="48" y="28" fill="#f8fafc" font-size="13" font-weight="700">FastAPI Gateway</text>
    <text x="48" y="42" fill="#64748b" font-size="10" font-weight="500">Distribution Tier</text>
    <line x1="16" y1="58" x2="139" y2="58" stroke="#1e293b" stroke-width="1" />

    <text x="16" y="80" fill="#cbd5e1" font-size="11" font-weight="600">• WebSocket Stream</text>
    <text x="16" y="98" fill="#cbd5e1" font-size="11" font-weight="600">• REST API Endpoints</text>
    <text x="16" y="116" fill="#cbd5e1" font-size="11" font-weight="600">• Pub/Sub Message Bus</text>
    <text x="16" y="134" fill="#cbd5e1" font-size="11" font-weight="600">• Event Commit Log</text>
    <text x="16" y="152" fill="#cbd5e1" font-size="11" font-weight="600">• Simulation Engine</text>
  </g>

  <!-- CARD 5: Client Experience -->
  <g transform="translate(780, 55)" filter="url(#cardShadow)">
    <rect width="140" height="160" rx="10" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="140" height="4" rx="2" fill="url(#accentBlue)" />
    <circle cx="24" cy="32" r="14" fill="#1e3a8a" />
    <text x="24" y="36" font-size="13" text-anchor="middle">📱</text>
    <text x="44" y="28" fill="#f8fafc" font-size="13" font-weight="700">Field &amp; Control</text>
    <text x="44" y="42" fill="#60a5fa" font-size="10" font-weight="600">Heron Clients</text>
    <line x1="14" y1="58" x2="126" y2="58" stroke="#1e293b" stroke-width="1" />

    <text x="14" y="80" fill="#bfdbfe" font-size="11" font-weight="700">• Native iOS App</text>
    <text x="14" y="98" fill="#cbd5e1" font-size="11" font-weight="600">• 0–10 Hazard Gauge</text>
    <text x="14" y="116" fill="#cbd5e1" font-size="11" font-weight="600">• Stop-Work Timer</text>
    <text x="14" y="134" fill="#bfdbfe" font-size="11" font-weight="700">• PlanIt Map (346)</text>
    <text x="14" y="152" fill="#cbd5e1" font-size="11" font-weight="600">• Photo Reports</text>
  </g>
</svg>
