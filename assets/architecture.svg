<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%" style="background:#0b131e; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142132" />
      <stop offset="100%" stop-color="#0d1724" />
    </linearGradient>
    <linearGradient id="cardHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2d42" />
      <stop offset="100%" stop-color="#111f30" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Connectors -->
  <line x1="196" y1="85" x2="216" y2="85" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3" opacity="0.8" />
  <line x1="376" y1="85" x2="396" y2="85" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3" opacity="0.8" />
  <line x1="556" y1="85" x2="576" y2="85" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3" opacity="0.8" />
  <line x1="736" y1="85" x2="756" y2="85" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3" opacity="0.8" />

  <!-- STAGE 1: Data Ingestion -->
  <g transform="translate(40, 25)" filter="url(#shadow)">
    <rect width="156" height="120" rx="10" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect width="156" height="3" rx="1.5" fill="#38bdf8" />
    <circle cx="78" cy="30" r="13" fill="#0c4a6e" />
    <text x="78" y="35" font-size="13" text-anchor="middle">📡</text>
    <text x="78" y="62" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Data Sources</text>
    <text x="78" y="80" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">Satellite &amp; Weather</text>
    <text x="78" y="96" fill="#64748b" font-size="9" text-anchor="middle">Multimodal Telemetry</text>
  </g>

  <!-- STAGE 2: Feature Pipeline -->
  <g transform="translate(220, 25)" filter="url(#shadow)">
    <rect width="156" height="120" rx="10" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect width="156" height="3" rx="1.5" fill="#2dd4bf" />
    <circle cx="78" cy="30" r="13" fill="#042f2e" />
    <text x="78" y="35" font-size="13" text-anchor="middle">⚙️</text>
    <text x="78" y="62" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Feature Pipeline</text>
    <text x="78" y="80" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">28 Physical Variables</text>
    <text x="78" y="96" fill="#64748b" font-size="9" text-anchor="middle">Soil, Flood &amp; Wind Math</text>
  </g>

  <!-- STAGE 3: AI Safety Engine (Highlighted Core) -->
  <g transform="translate(400, 25)" filter="url(#shadow)">
    <rect width="156" height="120" rx="10" fill="url(#cardHighlight)" stroke="#f59e0b" stroke-width="1.8" />
    <rect width="156" height="3" rx="1.5" fill="#f59e0b" />
    <circle cx="78" cy="30" r="13" fill="#451a03" />
    <text x="78" y="35" font-size="13" text-anchor="middle">🧠</text>
    <text x="78" y="62" fill="#fef3c7" font-size="12.5" font-weight="700" text-anchor="middle">AI Safety Engine</text>
    <text x="78" y="80" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle">Multi-Hazard GBDT</text>
    <text x="78" y="96" fill="#f59e0b" font-size="9" font-weight="500" text-anchor="middle">0–10 Index &amp; OSHA Rules</text>
  </g>

  <!-- STAGE 4: Realtime Gateway -->
  <g transform="translate(580, 25)" filter="url(#shadow)">
    <rect width="156" height="120" rx="10" fill="url(#cardBg)" stroke="#1e3a5f" stroke-width="1.5" />
    <rect width="156" height="3" rx="1.5" fill="#38bdf8" />
    <circle cx="78" cy="30" r="13" fill="#0c4a6e" />
    <text x="78" y="35" font-size="13" text-anchor="middle">⚡</text>
    <text x="78" y="62" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Streaming Hub</text>
    <text x="78" y="80" fill="#94a3b8" font-size="10" font-weight="500" text-anchor="middle">FastAPI &amp; WebSockets</text>
    <text x="78" y="96" fill="#64748b" font-size="9" text-anchor="middle">Sub-Second Dispatch</text>
  </g>

  <!-- STAGE 5: Field & Control -->
  <g transform="translate(760, 25)" filter="url(#shadow)">
    <rect width="156" height="120" rx="10" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5" />
    <rect width="156" height="3" rx="1.5" fill="#3b82f6" />
    <circle cx="78" cy="30" r="13" fill="#1e3a8a" />
    <text x="78" y="35" font-size="13" text-anchor="middle">📱</text>
    <text x="78" y="62" fill="#f8fafc" font-size="12.5" font-weight="700" text-anchor="middle">Field &amp; Dispatch</text>
    <text x="78" y="80" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">Heron iOS App</text>
    <text x="78" y="96" fill="#64748b" font-size="9" text-anchor="middle">PlanIt Supervisor Map</text>
  </g>
</svg>
